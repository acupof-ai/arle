[[semantic]]
id = "qwen.fp8_dense_projection"
kind = "composite"
inputs = ["activation", "fp8_weight", "block_scales"]
outputs = ["projection"]
reference = "cuda.qwen.fp8_gemv"
correctness_gate = "numeric+e2e"

[[implementation]]
id = "cuda.qwen.fp8_pack_deepgemm"
semantic = "qwen.fp8_dense_projection"
provider = "deepgemm"
source = "crates/infer-cuda/src/ops/quant_linear.rs"
legality = "sm90 && exact_shape_cell && preflight"
fallback = "cuda.qwen.fp8_gemv"

[[implementation]]
id = "cuda.qwen.fp8_dequant_bf16_gemm"
semantic = "qwen.fp8_dense_projection"
provider = "cublas"
source = "crates/infer-cuda/src/ops/quant_linear.rs"
legality = "sm<9 && m>=16"
fallback = "cuda.qwen.fp8_gemv"

[[implementation]]
id = "cuda.qwen.fp8_gemv"
semantic = "qwen.fp8_dense_projection"
provider = "arle"
source = "crates/infer-cuda/src/ops/quant_linear.rs"
legality = "always"
fallback = ""

[policy."qwen.fp8_dense_projection"]
numeric_tolerance_mode = "abs+rel*abs(reference)"
numeric_abs_tolerance = 1.0
numeric_rel_tolerance = 0.02
fallback_min_m = 2
fallback_status = "legacy-default-unqualified"

[[semantic]]
id = "qwen.rms_norm"
kind = "primitive"
inputs = ["hidden", "gamma"]
outputs = ["normed"]
reference = "cuda.qwen.rms_norm_batched"
correctness_gate = "numeric+e2e"

[[implementation]]
id = "cuda.qwen.rms_norm_batched"
semantic = "qwen.rms_norm"
provider = "arle"
source = "crates/cuda-kernels/src/tensor_ops.rs"
legality = "always"
fallback = ""

[[implementation]]
id = "cuda.qwen.rms_norm_vec"
semantic = "qwen.rms_norm"
provider = "arle"
source = "crates/cuda-kernels/src/tensor_ops.rs"
legality = "seq_len==1"
fallback = "cuda.qwen.rms_norm_batched"

[policy."qwen.rms_norm"]
numeric_tolerance_mode = "abs+rel*abs(reference)"
numeric_abs_tolerance = 0.01
numeric_rel_tolerance = 0.02
fallback_status = "legacy-default-unqualified"
