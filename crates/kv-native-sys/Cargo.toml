[package]
name = "kv-native-sys"
version = "0.5.8"
edition = "2024"
license = "MIT"
publish = true
repository.workspace = true
description = "Host KV tier storage: sparse mmap page-slot store with direct I/O and io_uring paths."

[dependencies]
anyhow = "1.0"
infer-seam = { path = "../infer-seam", version = "0.5.8" }
libc = "0.2"
log = "0.4"
memmap2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
