[package]
name = "cli"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# No backend default — pick one explicitly:
#   --features cuda            Linux + NVIDIA
#   --features metal,no-cuda   Apple Silicon
#   --features cpu,no-cuda     portable smoke
default = []
cuda = ["infer-api/cuda", "train/cuda", "autograd/cuda"]
no-cuda = ["infer-api/no-cuda", "train/no-cuda", "autograd/no-cuda"]
cpu = ["infer-api/cpu"]
metal = ["infer-api/metal", "train/metal", "autograd/metal"]
# HIP backend (AMD ROCm, DSv4 GGUF). Pair with `no-cuda` off-box; train/autograd
# have no HIP code, so only infer-api forwards.
hip = ["infer-api/hip"]
# Vulkan backend (cross-vendor / Windows lane). Pair with `no-cuda` off-box;
# train/autograd have no Vulkan code, so only infer-api forwards.
vulkan = ["infer-api/vulkan"]
nccl = ["cuda", "infer-api/nccl", "train/nccl", "autograd/nccl"]
deepep = ["nccl", "infer-api/deepep"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
console = "0.16"
ctrlc = "3"
dialoguer = "0.11"
hf-hub = { version = "0.5", features = ["tokio"] }
indicatif = "0.18"
# DSv4 multiproc-serve: coordinator -> worker death-detect pipe (Unix `pipe(2)`).
# Used only by `serve_multiproc` (cfg(all(unix, feature = "cuda"))).
libc = "0.2"
agent = { path = "../agent" }
autograd = { path = "../autograd", default-features = false }
chat = { path = "../chat" }
infer-api = { path = "../infer-api" }
infer-plan = { path = "../infer-plan" }
infer-util = { path = "../infer-util" }
deepseek-spec = { path = "../deepseek-spec" }
qwen35-spec = { path = "../qwen35-spec" }
spec-train = { path = "../spec-train" }
train = { path = "../train", default-features = false }
tools = { path = "../tools" }
log = "0.4"
nucleo-matcher = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rustyline = "15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35"
tokio = { version = "1", features = ["sync"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
