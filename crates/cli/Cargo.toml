[package]
name = "cli"
version = "0.5.8"
edition = "2024"
license = "MIT"
publish = false

[features]
# No backend default — pick one explicitly:
#   --features cuda            Linux + NVIDIA
#   --features metal,no-cuda   Apple Silicon
default = []
cuda = ["infer-api/cuda", "train/cuda", "autograd/cuda"]
no-cuda = ["infer-api/no-cuda", "train/no-cuda", "autograd/no-cuda"]
# Metal backend. infer-api is backend-neutral now; this pulls infer-metal for
# the CLI's own metal-specific surfaces (--doctor resource planning, hardware
# working-set) and forwards to train/autograd.
metal = ["dep:infer-metal", "infer-metal/metal", "train/metal", "autograd/metal"]
nccl = ["cuda", "infer-api/nccl", "train/nccl", "autograd/nccl"]
deepep = ["nccl", "infer-api/deepep"]
# Grammar-constrained decode (xgrammar real backend). Requires
# XGRAMMAR_SOURCE_DIR at build time.
grammar = ["infer-api/grammar"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
console = "0.16"
ctrlc = "3"
dialoguer = "0.11"
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls", "ureq"] }
indicatif = "0.18"
# DSv4 multiproc-serve: coordinator -> worker death-detect pipe (Unix `pipe(2)`).
# Used only by `serve_multiproc` (cfg(all(unix, feature = "cuda"))).
libc = "0.2"
agent = { path = "../agent" }
autograd = { path = "../autograd", default-features = false }
chat = { path = "../chat" }
infer-api = { path = "../infer-api" }
infer-metal = { path = "../infer-metal", default-features = false, optional = true }
infer-plan = { path = "../infer-plan" }
infer-util = { path = "../infer-util" }
deepseek-spec = { path = "../deepseek-spec" }
qwen35-spec = { path = "../qwen35-spec" }
spec-train = { path = "../spec-train" }
train = { path = "../train", default-features = false }
tools = { path = "../tools" }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustyline = "15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35"
tokenizers = { workspace = true }
tokio = { version = "1", features = ["sync"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
