[package]
name = "deepep-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Torch-free Rust binding for deepseek-ai/DeepEP intranode dispatch/combine kernels. Phase B-2 of the multiproc-serve pivot."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Build decision is made by build.rs via the ARLE_DEEPEP_DIR env var
# (sets cfg(deepep_stub) when absent). No feature gate needed.

[dependencies]
anyhow = "1"
thiserror = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(deepep_stub)",
    "cfg(deepep_nvshmem)",
] }
