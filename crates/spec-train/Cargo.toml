[package]
name = "spec-train"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = []
no-cuda = ["autograd/no-cuda"]
metal = ["autograd/metal"]
cuda = ["autograd/cuda"]

[dependencies]
autograd = { path = "../autograd", default-features = false, features = ["safetensors"] }
anyhow = "1.0"
half = "2"
memmap2 = { workspace = true }
qwen35-spec = { path = "../qwen35-spec" }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }

[dev-dependencies]
ahash = "0.8"
