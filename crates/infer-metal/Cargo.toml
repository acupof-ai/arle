[package]
name = "infer-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
deepseek-ocr-spec = { path = "../deepseek-ocr-spec", optional = true }
hf-hub = { version = "0.5", features = ["tokio"], optional = true }
infer-plan = { path = "../infer-plan" }
infer-seam = { path = "../infer-seam" }
kv-native-sys = { path = "../kv-native-sys", optional = true }
log = "0.4"
mlx-sys = { path = "../mlx-sys", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
metal = ["dep:deepseek-ocr-spec", "dep:hf-hub", "dep:kv-native-sys", "dep:mlx-sys", "dep:serde", "dep:serde_json"]

[lints]
workspace = true
