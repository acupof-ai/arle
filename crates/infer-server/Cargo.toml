[package]
name = "infer-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Compile the real xgrammar backend; without it `response_format` is rejected.
grammar = ["xgrammar-sys/real"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chat = { path = "../chat" }
ahash = { workspace = true }
bincode = { workspace = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer-core = { path = "../infer-core" }
infer-plan = { path = "../infer-plan", features = ["serde"] }
infer-seam = { path = "../infer-seam" }
libc = "0.2"
log = "0.4"
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.35"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tokenizers = { workspace = true }
uuid = { workspace = true }
xgrammar-sys = { path = "../xgrammar-sys" }
minijinja = { version = "2.20.0", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2.20.0", features = ["pycompat"] }

[lints]
workspace = true
