[package]
name = "agent-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
libc = "0.2"
infer-plan = { path = "../infer-plan" }
infer-seam = { path = "../infer-seam" }
infer-core = { path = "../infer-core" }
infer-metal = { path = "../infer-metal" }

[features]
default = []
# Drive the REAL Metal (MLX) engine instead of EchoExecutor. Enables the
# `metal_engine_from_model_path` constructor (cfg-gated) by turning on the MLX
# stack inside infer-metal. The default build stays EchoExecutor + MLX-free.
metal = ["infer-metal/metal"]

[lints]
workspace = true
