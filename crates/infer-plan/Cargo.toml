[package]
name = "infer-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Backend-independent inference planning data: sampling params and request/step plans shared by engine and executors."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
anyhow = "1.0"
serde = { workspace = true, optional = true, features = ["derive", "rc"] }
