[package]
name = "deepseek-kernels-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Raw FFI to vendored DeepSeek FlashMLA / DeepGEMM kernels and the FA3-hopper instantiation units, built with nvcc"
links = "deepseek_kernels"
# Vendored upstream trees carry their own LICENSE files under vendor/.

[features]
# `cuda` declares the extern "C" surface (cudarc driver types in signatures).
cuda = ["dep:cudarc"]
# `no-cuda` skips nvcc in build.rs so `cuda,no-cuda` typechecks without a toolkit.
no-cuda = []

[dependencies]
cudarc = { version = "0.19", features = [
    "cuda-version-from-build-system",
    "cublas",
    "f16",
], optional = true }

[lints]
workspace = true
