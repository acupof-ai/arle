[package]
name = "vulkan-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vulkan-sys = { path = "../vulkan-sys", default-features = false }

[dev-dependencies]
# Reference dequantizers for the on-device GEMV correctness test. The Vulkan
# weight bytes are dequantized with the SAME routine to build the CPU reference.
infer-gguf = { path = "../infer-gguf" }

[features]
default = []
# Compile and launch Vulkan kernels through vulkan-sys. Off by default so the
# workspace typechecks on machines without a Vulkan loader or glslc.
vulkan = ["vulkan-sys/vulkan"]

[lints]
workspace = true
