[package]
name = "infer-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Public `InferenceEngine` adapter over the rewrite stack (infer-core Engine +
# infer-server ServeHandle + infer-plan SamplingParams). Exposes the SAME public
# contract the legacy `infer::server_engine` provides so agent/cli/train can
# later swap `infer` -> `infer-api` with zero code changes. This crate is
# additive: it does not migrate any consumer.

[dependencies]
spec-train = { path = "../spec-train" }
anyhow = "1.0"
axum = "0.8"
fastrace = { version = "0.7.16", features = ["enable"] }
infer-core = { path = "../infer-core" }
infer-plan = { path = "../infer-plan", features = ["serde"] }
infer-seam = { path = "../infer-seam" }
infer-server = { path = "../infer-server" }
infer-util = { path = "../infer-util" }
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# `rt-multi-thread` + `net` + `signal` back the in-process `serve_http` server
# loop (the legacy `infer`/`metal_serve` bins were `#[tokio::main]`; the sync CLI
# now drives the same axum::serve loop on an owned runtime).
tokio = { version = "1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }

infer-metal = { path = "../infer-metal", default-features = false, optional = true }
infer-cuda = { path = "../infer-cuda", default-features = false, optional = true }
infer-hip = { path = "../infer-hip", default-features = false, optional = true }
infer-vulkan = { path = "../infer-vulkan", default-features = false, optional = true }
# CUDA-only: `RawLogits` carries a `cuda_kernels` device buffer/context and reads
# its raw device pointer via the `cudarc` `DevicePtr` trait for the OPD-teacher
# raw-logits surface. Both engage only under `--features cuda`.
cuda-kernels = { path = "../cuda-kernels", default-features = false, optional = true }
cudarc = { version = "0.19", features = [
    "cuda-version-from-build-system",
    "cublas",
    "f16",
], optional = true }
# CUDA-only: `--lora-adapters` safetensors -> StudentLoraUpdate loading
# (`student_lora.rs`); host-only decode, no device code.
safetensors = { workspace = true, optional = true }
half = { version = "2", optional = true }

[features]
# No backend defaulted, mirroring the legacy `infer` crate: callers pick one.
#   --features cuda            Linux + NVIDIA
#   --features metal,no-cuda   Apple Silicon
#   --features cpu,no-cuda     portable smoke / CI
default = []
# CUDA backend (structurally wired; the real forward is Phase-0 / lead-owned).
# Pulls `cuda-kernels` + `cudarc` for the OPD-teacher `RawLogits` device surface.
cuda = [
    "dep:infer-cuda",
    "infer-cuda/cuda",
    "dep:cuda-kernels",
    "cuda-kernels/cuda",
    "dep:cudarc",
    "dep:safetensors",
    "dep:half",
]
# Marker feature for builds without a CUDA toolchain (macOS, dev CI).
no-cuda = ["infer-cuda?/no-cuda", "cuda-kernels?/no-cuda"]
# Metal backend via infer-metal (Apple Silicon).
metal = ["dep:infer-metal", "infer-metal/metal"]
# HIP backend via infer-hip (AMD ROCm, DSv4 GGUF). infer-server has no
# hip-specific code, so no infer-server feature is forwarded (unlike metal).
hip = ["dep:infer-hip", "infer-hip/hip"]
# Vulkan backend via infer-vulkan (cross-vendor, Windows lane). infer-server
# stays backend-neutral; device code is gated below infer-vulkan.
vulkan = ["dep:infer-vulkan", "infer-vulkan/vulkan"]
# Portable CPU backend: drives the engine over infer-metal's feature-free
# host KV pool + the placeholder MetalExecutor (no MLX, no CUDA). Used for
# smoke / CI and the adapter integration test.
cpu = ["dep:infer-metal"]
# Multi-rank NCCL collectives for the TP communicator. Implies `cuda`; forwards
# to infer-cuda's `nccl` feature (declared optionally so it only engages when
# the CUDA backend is pulled in).
nccl = ["cuda", "infer-cuda?/nccl"]
deepep = ["nccl", "infer-cuda?/deepep"]

[dev-dependencies]
infer-core = { path = "../infer-core" }
infer-metal = { path = "../infer-metal", default-features = false }
infer-server = { path = "../infer-server" }
tempfile = "3"
tokenizers = { workspace = true }

[lints]
workspace = true
