[package]
name = "train"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Train jobs are dispatched by the `arle train ...` front door in
# `crates/cli/src/train_cli.rs`. The standalone `[[bin]]` targets that
# previously shipped `pretrain` / `train_sft` / `train_grpo` /
# `train_multi_turn` / `eval_lm` / `download_dataset` / `convert_dataset`
# are intentionally removed; autobins stays disabled so Cargo does not
# rediscover anything as a binary.
autobins = false

[features]
default = []
no-cuda = ["autograd/no-cuda", "infer-api?/no-cuda"]
metal = ["autograd/metal"]
cuda = ["autograd/cuda", "dep:infer-api", "infer-api/cuda"]
# DSv4-Flash teacher needs TP (nccl) + DeepEP MoE dispatch; forwarded to
# infer-api -> infer-cuda. Opt-in: only the in-process DSv4-teacher OPD path
# (Flash teacher -> dense student) pulls these; dense-only OPD ignores them.
nccl = ["cuda", "autograd/nccl", "dep:cuda-kernels", "cuda-kernels/nccl", "infer-api/nccl"]
deepep = ["nccl", "infer-api/deepep"]

[dependencies]
autograd = { path = "../autograd", default-features = false, features = ["safetensors"] }
anyhow = "1.0"
half = "2"
memmap2 = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }
ureq = { version = "2.12", features = ["json"] }
qwen35-spec = { path = "../qwen35-spec" }
chat = { path = "../chat" }
# Device-neutral coord/sharding math (std-only): the one mesh both serve and
# train read parallelism coordinates from.
infer-topo = { path = "../infer-topo" }
infer-api = { path = "../infer-api", default-features = false, optional = true }
infer-plan = { path = "../infer-plan" }
# cc-convert reuses the REAL /v1/messages -> ChatCompletionRequest mapping
# (host-only crate; no device code), so converted records can't drift from the
# served prompt format.
infer-server = { path = "../infer-server" }
cuda-kernels = { path = "../cuda-kernels", default-features = false, optional = true }
# Non-test use: sandbox run_captured writes subprocess output to a temp file
# (avoids the wait_with_output pipe-hold hang when a tool command backgrounds a
# process). Also used by tests.
tempfile = "3"
# Spawner uses libc::kill to signal process groups without forking an external
# `kill` binary (extra forks from the spawner can trigger ELKEID ancestry checks).
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
