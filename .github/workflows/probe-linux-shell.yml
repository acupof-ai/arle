name: Probe shell tests on Linux
on:
  push:
    branches: [lane/ci-shell-test-discovery]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python dev deps (mirror python-test job)
        run: pip install -e ".[dev]"
      - name: Run all scripts/tests/test_*.sh in isolated process groups
        run: |
          set -u
          fail=0
          for t in $(git ls-files 'scripts/tests/test_*.sh' | sort); do
            echo "===== PROBE $t ====="
            if setsid bash "$t" >"/tmp/$(basename "$t").log" 2>&1; then
              echo "PROBE-RESULT $t PASS"
            else
              echo "PROBE-RESULT $t FAIL (exit $?)"
              tail -30 "/tmp/$(basename "$t").log"
              fail=1
            fi
          done
          echo "PROBE-DONE fail=$fail"
