name: Kernels Publish

# Candidate mode builds once, then proves the exact Action artifact is consumable
# without TileLang. Qualification mode only promotes that tested candidate.
on:
  push:
    branches: [main]
    paths:
      - crates/cuda-kernels/tools/tilelang/**
      - crates/cuda-kernels/csrc/**
      - crates/cuda-kernels/src/**
      - crates/cuda-kernels/vendor/**
      - crates/infer-cuda/src/**
      - crates/cuda-kernels/kernels.toml
      - crates/cuda-kernels/build.rs
      - requirements-build.txt
      - scripts/kernel_artifacts.sh
      - scripts/cuda_prebuilt_manifest.sh
      - .github/workflows/kernels-publish.yml
  workflow_dispatch:
    inputs:
      kernel_candidate_run_id:
        description: Candidate-mode Kernels Publish run ID; enables qualification mode
        required: false
        type: string
      evidence_run_ids:
        description: Comma/newline-separated run IDs whose artifacts contain a kernel-qualification-fragment (produced by the manual pod/V100 GPU gate)
        required: false
        type: string

# Build and qualification lanes must not kill each other: a push during a
# qualification dispatch would otherwise cancel it (and vice versa). Build
# runs queue (not cancel) so the sccache cache is saved — a cancelled build
# skips the cache post-step, leaving every run cold at ~54 min.
concurrency:
  group: kernels-publish-${{ inputs.kernel_candidate_run_id && 'qualify' || 'build' }}
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: ""
  # One arch string for skip-id, codegen, pack, and publish — the arch list is
  # part of the bundle identity, so all steps must read the same value.
  TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

jobs:
  validate-mode:
    name: Validate mode
    runs-on: ubuntu-latest
    outputs:
      qualify: ${{ steps.mode.outputs.qualify }}
    steps:
      - id: mode
        env:
          CANDIDATE_RUN_ID: ${{ inputs.kernel_candidate_run_id }}
          EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
        run: |
          if [[ -n "$CANDIDATE_RUN_ID" || -n "$EVIDENCE_RUN_IDS" ]]; then
            test -n "$CANDIDATE_RUN_ID" && test -n "$EVIDENCE_RUN_IDS"
            echo 'qualify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualify=false' >> "$GITHUB_OUTPUT"
          fi

  skip-published:
    name: Skip if bundle already published
    needs: validate-mode
    if: ${{ needs.validate-mode.outputs.qualify == 'false' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # Bundles are content-addressed by tracked kernel-input content; an
      # existing asset pair is byte-identical to what a rebuild would produce
      # and was already consume-checked when first published. Most pushes
      # (runtime, docs, Metal) do not change kernel inputs — skip the ~1h
      # build entirely. Require BOTH assets: a build cancelled mid-publish can
      # leave the tar.gz without its checksum.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(scripts/kernel_artifacts.sh id)"
          assets="$(gh release view kernel-artifacts -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"
          if grep -Fxq "arle-kernels-t1-$id.tar.gz" <<<"$assets" \
              && grep -Fxq "arle-kernels-t1-$id.tar.gz.sha256" <<<"$assets"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "candidate bundle $id already published — nothing to build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build T1 kernel candidate
    needs: [validate-mode, skip-published]
    if: ${{ needs.validate-mode.outputs.qualify == 'false' && needs.skip-published.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04
      options: --rm
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: apt-get update && apt-get install -y --no-install-recommends git python3 python3-pip curl ca-certificates

      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # TileLang artifact cache (per-kernel source × SM × toolchain identity).
      # Restores unchanged kernels' codegen output; build.rs validates the
      # identity before reuse, so a mismatch falls back to regeneration.
      - name: Cache TileLang artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/arle-cuda-kernels
          key: tilelang-artifacts-${{ github.run_id }}
          restore-keys: |
            tilelang-artifacts-

      # Local disk cache, not the GHA backend — that flooded the 10 GB quota
      # with 2581 per-object entries (ci.yml, 2026-07-02).
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache sccache (nvcc)
        uses: actions/cache@v6
        with:
          path: ~/.cache/sccache
          key: sccache-cuda-${{ github.run_id }}
          restore-keys: |
            sccache-cuda-

      - name: Install TileLang stack (vanilla tvm-ffi, no patch needed)
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages -r requirements-build.txt
          python3 -c "import tilelang; print('tilelang OK', tilelang.__version__)"

      - name: Regenerate T1 kernel set (sm_80/86/89/90)
        env:
          ARLE_KERNEL_VENDOR: '1'
          ARLE_NVCC_WRAPPER: 'sccache'
          SCCACHE_CACHE_SIZE: '5G'
        run: cargo build --release --features cuda -p cuda-kernels

      - name: Pack unqualified candidate
        env:
          ARLE_KERNEL_CORRECTNESS_STATUS: not-run
        run: scripts/kernel_artifacts.sh pack

      # Publish candidate so validate_release.sh resolves the exact bundle id.
      # Candidate-only (no GPU evidence) is accepted; qualify job attaches the sidecar later.
      - name: Publish candidate bundle
        env:
          ARLE_KERNEL_CORRECTNESS_STATUS: not-run
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/kernel_artifacts.sh publish

      - name: Upload exact candidate
        uses: actions/upload-artifact@v7
        with:
          name: kernel-bundle-candidate
          path: |
            arle-kernels-t1-*.tar.gz
            arle-kernels-t1-*.tar.gz.sha256

  consume-check:
    name: Zero-Python exact candidate consume
    needs: [validate-mode, skip-published, build]
    if: ${{ needs.validate-mode.outputs.qualify == 'false' && needs.skip-published.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04
      options: --rm
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-bundle-candidate
          path: /tmp/kernel-bundle-candidate

      - name: Fetch exact candidate
        run: scripts/kernel_artifacts.sh fetch /tmp/kernel-bundle-candidate

      - name: Build product cold with TileLang poisoned
        env:
          ARLE_CUDA_KERNEL_CACHE: '0'
          # Absolute path: cargo runs build.rs with CWD = the crate root, so a
          # repo-root-relative path would resolve to crates/cuda-kernels/crates/...
          ARLE_CUDA_KERNELS_PREBUILT_DIR: ${{ github.workspace }}/crates/cuda-kernels/generated
          INFER_TILELANG_PYTHON: /usr/bin/false
          CARGO_TARGET_DIR: product/cuda-kernels
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          cargo build --release --features cuda -p arle --bin arle

  qualify:
    name: Aggregate and promote tested candidate
    needs: validate-mode
    if: ${{ needs.validate-mode.outputs.qualify == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download named candidate and evidence fragments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.kernel_candidate_run_id }}
          EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
        run: |
          mkdir -p /tmp/kernel-candidate /tmp/kernel-fragments
          gh run download "$CANDIDATE_RUN_ID" -n kernel-bundle-candidate -D /tmp/kernel-candidate
          printf '%s\n' "$EVIDENCE_RUN_IDS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | while read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            dir="/tmp/kernel-fragments/$run_id"
            mkdir "$dir"
            gh run download "$run_id" -n kernel-qualification-fragment -D "$dir"
          done

      - name: Aggregate exact candidate evidence
        run: |
          mapfile -t candidates < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz' -type f)
          ((${#candidates[@]} == 1))
          mapfile -t checksums < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz.sha256' -type f)
          ((${#checksums[@]} == 1))
          mapfile -t fragments < <(find /tmp/kernel-fragments -name qualification-fragment.json -type f | sort)
          ((${#fragments[@]} > 0))
          scripts/kernel_artifacts.sh aggregate-qualification "${candidates[0]}" /tmp/aggregate-qualification.json "${fragments[@]}"

      - name: Qualify and publish exact candidate bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t candidates < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz' -type f)
          ((${#candidates[@]} == 1))
          scripts/kernel_artifacts.sh qualify-publish "${candidates[0]}" /tmp/aggregate-qualification.json

      - name: Attest immutable candidate and qualification
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            /tmp/kernel-candidate/arle-kernels-t1-*.tar.gz
            /tmp/kernel-candidate/arle-kernels-t1-*.tar.gz.sha256
            /tmp/aggregate-qualification.json
