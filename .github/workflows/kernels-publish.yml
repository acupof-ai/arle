name: Kernels Publish

# Candidate mode builds once, then proves the exact Action artifact is consumable
# without TileLang. Qualification mode only promotes that tested candidate.
on:
  push:
    branches: [main]
    paths:
      - crates/cuda-kernels/tools/tilelang/**
      - crates/cuda-kernels/csrc/**
      - crates/cuda-kernels/ffi/**
      - crates/cuda-kernels/src/**
      - crates/infer-cuda/src/**
      - vendor/flash-attention/**
      - vendor/flashmla/**
      - crates/cuda-kernels/kernels.toml
      - crates/cuda-kernels/build.rs
      - requirements-build.txt
      - scripts/kernel_artifacts.sh
      - scripts/cuda_prebuilt_manifest.sh
      - .github/workflows/kernels-publish.yml
  workflow_dispatch:
    inputs:
      kernel_candidate_run_id:
        description: Candidate-mode Kernels Publish run ID; enables qualification mode
        required: false
        type: string
      evidence_run_ids:
        description: Comma/newline-separated run IDs whose artifacts contain a kernel-qualification-fragment (produced by the manual pod/V100 GPU gate)
        required: false
        type: string

concurrency:
  group: kernels-publish
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

jobs:
  validate-mode:
    name: Validate mode
    runs-on: ubuntu-latest
    outputs:
      qualify: ${{ steps.mode.outputs.qualify }}
    steps:
      - id: mode
        env:
          CANDIDATE_RUN_ID: ${{ inputs.kernel_candidate_run_id }}
          EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
        run: |
          if [[ -n "$CANDIDATE_RUN_ID" || -n "$EVIDENCE_RUN_IDS" ]]; then
            test -n "$CANDIDATE_RUN_ID" && test -n "$EVIDENCE_RUN_IDS"
            echo 'qualify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualify=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build T1 kernel candidate
    needs: validate-mode
    if: ${{ needs.validate-mode.outputs.qualify == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The torch cu129 stack unpacks ~15 GB; stock ubuntu-latest free space is
      # borderline and the install ENOSPC'd (2026-07-23). Drop preinstalled
      # toolchains we never use (~25-30 GB reclaimed).
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install TileLang stack (vanilla tvm-ffi, no patch needed)
        run: |
          pip install --no-cache-dir -r requirements-build.txt
          python -c "import tilelang; print('tilelang OK', tilelang.__version__)"

      - name: Regenerate T1 kernel set (sm_80/86/89/90)
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_ENABLE_FA3: '1'
          ARLE_KERNEL_VENDOR: '1'
          ARLE_CUDA_KERNEL_CACHE: '0'
        run: cargo build --release --features cuda -p cuda-kernels

      - name: Pack unqualified candidate
        env:
          ARLE_KERNEL_CORRECTNESS_STATUS: not-run
        run: scripts/kernel_artifacts.sh pack

      - name: Upload exact candidate
        uses: actions/upload-artifact@v7
        with:
          name: kernel-bundle-candidate
          path: |
            arle-kernels-t1-*.tar.gz
            arle-kernels-t1-*.tar.gz.sha256

  consume-check:
    name: Zero-Python exact candidate consume
    needs: [validate-mode, build]
    if: ${{ needs.validate-mode.outputs.qualify == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-bundle-candidate
          path: /tmp/kernel-bundle-candidate

      - name: Fetch exact candidate
        run: scripts/kernel_artifacts.sh fetch /tmp/kernel-bundle-candidate

      - name: Build product cold with TileLang poisoned
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_ENABLE_FA3: '1'
          ARLE_CUDA_KERNEL_CACHE: '0'
          INFER_TILELANG_PYTHON: /usr/bin/false
          CARGO_TARGET_DIR: product/cuda-kernels
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          cargo build --release --features cuda -p arle --bin arle

  qualify:
    name: Aggregate and promote tested candidate
    needs: validate-mode
    if: ${{ needs.validate-mode.outputs.qualify == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download named candidate and evidence fragments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.kernel_candidate_run_id }}
          EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
        run: |
          mkdir -p /tmp/kernel-candidate /tmp/kernel-fragments
          gh run download "$CANDIDATE_RUN_ID" -n kernel-bundle-candidate -D /tmp/kernel-candidate
          printf '%s\n' "$EVIDENCE_RUN_IDS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | while read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            dir="/tmp/kernel-fragments/$run_id"
            mkdir "$dir"
            gh run download "$run_id" -n kernel-qualification-fragment -D "$dir"
          done

      - name: Aggregate exact candidate evidence
        run: |
          mapfile -t candidates < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz' -type f)
          ((${#candidates[@]} == 1))
          mapfile -t checksums < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz.sha256' -type f)
          ((${#checksums[@]} == 1))
          mapfile -t fragments < <(find /tmp/kernel-fragments -name qualification-fragment.json -type f | sort)
          ((${#fragments[@]} > 0))
          scripts/kernel_artifacts.sh aggregate-qualification "${candidates[0]}" /tmp/aggregate-qualification.json "${fragments[@]}"

      - name: Qualify and publish exact candidate bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t candidates < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz' -type f)
          ((${#candidates[@]} == 1))
          scripts/kernel_artifacts.sh qualify-publish "${candidates[0]}" /tmp/aggregate-qualification.json

      - name: Attest immutable candidate and qualification
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            /tmp/kernel-candidate/arle-kernels-t1-*.tar.gz
            /tmp/kernel-candidate/arle-kernels-t1-*.tar.gz.sha256
            /tmp/aggregate-qualification.json
