name: Kernels Publish

# Regenerate the TileLang AOT kernel bundle whenever a kernel-relevant source
# changes and publish an immutable, source-addressed asset to the
# `kernel-artifacts` release. Consumers compute the same exact identity; there
# is no mutable latest asset. This job is the one place that needs TileLang.
on:
  push:
    branches: [main]
    paths:
      - crates/cuda-kernels/tools/tilelang/**
      - crates/cuda-kernels/csrc/**
      - crates/cuda-kernels/ffi/**
      - crates/cuda-kernels/src/**
      - crates/infer-cuda/src/**
      - vendor/flash-attention/**
      - vendor/flashmla/**
      - crates/cuda-kernels/kernels.toml
      - crates/cuda-kernels/build.rs
      - requirements-build.txt
      # The bundle id + pack/fetch contract — a change here re-addresses the bundle.
      - scripts/kernel_artifacts.sh
      - scripts/cuda_prebuilt_manifest.sh
      - .github/workflows/kernels-publish.yml
  workflow_dispatch:
    inputs:
      correctness_evidence_run_id:
        description: CUDA CI run ID containing kernel-correctness evidence
        required: false
        type: string
      kernel_candidate_run_id:
        description: Kernels Publish run ID containing the tested kernel-bundle-candidate
        required: false
        type: string

concurrency:
  group: kernels-publish
  cancel-in-progress: true

env:
  # .cargo/config.toml pins rustc-wrapper=sccache for local dev; not installed here.
  RUSTC_WRAPPER: ""

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build T1 kernel bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install TileLang stack (pinned set + carried tvm-ffi patch)
        # Vanilla tvm-ffi at the pin aborts `import tilelang` under tilelang's
        # bundled TVM (tile-ai/tilelang#2367); rebuild it from sdist with the
        # carried patch — same flow as scripts/pod-tilelang-env.sh.
        run: |
          pip install --no-cache-dir -r requirements-build.txt
          pin="$(grep -oE 'apache-tvm-ffi==[0-9.]+' requirements-build.txt | cut -d= -f3)"
          pip download --no-deps --no-binary :all: -d /tmp/ffi "apache-tvm-ffi==$pin"
          tar -xzf /tmp/ffi/apache*tvm*ffi-*.tar.gz -C /tmp/ffi
          patch -p1 -d /tmp/ffi/apache*tvm*ffi-*/ \
            < crates/cuda-kernels/tools/tilelang/patches/tvm-ffi-legacy-tvm-compat.patch
          pip install --no-cache-dir "cython>=3.1.0" scikit-build-core setuptools-scm ninja cmake
          pip wheel --no-deps --no-build-isolation -w /tmp/ffi /tmp/ffi/apache*tvm*ffi-*/
          pip install --force-reinstall --no-deps /tmp/ffi/apache*tvm*ffi-*.whl
          python -c "import tilelang; print('tilelang OK', tilelang.__version__)"

      - name: Regenerate T1 kernel set (sm_80/86/89/90)
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_ENABLE_FA3: '1'
          ARLE_KERNEL_VENDOR: '1'
          ARLE_CUDA_KERNEL_CACHE: '0'
        run: cargo build --release --features cuda -p cuda-kernels

      - name: Pack unqualified bundle
        env:
          ARLE_KERNEL_CORRECTNESS_STATUS: not-run
        run: scripts/kernel_artifacts.sh pack

      - name: Upload bundle candidate
        uses: actions/upload-artifact@v7
        with:
          name: kernel-bundle-candidate
          path: |
            arle-kernels-t1-*.tar.gz
            arle-kernels-t1-*.tar.gz.sha256

  # The consumer contract, proven cold on every refresh: a fresh runner with
  # NO Python kernel stack fetches the bundle and builds the full T1 set —
  # any regen attempt (bundle stale/incomplete) panics with the tilelang
  # probe error and fails this job.
  consume-check:
    name: Zero-Python candidate consume check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Download bundle candidate
        uses: actions/download-artifact@v8
        with:
          name: kernel-bundle-candidate
          path: /tmp/kernel-bundle-candidate

      - name: Fetch the exact candidate bundle
        run: scripts/kernel_artifacts.sh fetch /tmp/kernel-bundle-candidate

      - name: Build the T1 kernel set with zero Python
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_ENABLE_FA3: '1'
          ARLE_CUDA_KERNEL_CACHE: '0'
          # Poison the tilelang probe: consume must never need it.
          INFER_TILELANG_PYTHON: /usr/bin/false
        run: cargo build --release --features cuda -p cuda-kernels

  publish-qualified:
    name: Publish correctness-qualified bundle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.correctness_evidence_run_id != '' && inputs.kernel_candidate_run_id != '' }}
    needs: [build, consume-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download correctness evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.correctness_evidence_run_id }}" -n kernel-correctness -D /tmp/kernel-correctness

      - name: Download tested kernel candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.kernel_candidate_run_id }}" -n kernel-bundle-candidate -D /tmp/kernel-bundle-candidate

      - name: Verify tested candidate identity
        id: tested
        run: |
          CANDIDATE="$(compgen -G '/tmp/kernel-bundle-candidate/arle-kernels-t1-*.tar.gz')"
          CANDIDATE_SHA="$(sha256sum "$CANDIDATE" | cut -d' ' -f1)"
          mkdir /tmp/kernel-candidate-manifest
          tar -xzf "$CANDIDATE" -C /tmp/kernel-candidate-manifest ./manifest.json
          BUNDLE_ID="$(jq -er '.bundle_id' /tmp/kernel-candidate-manifest/manifest.json)"
          test "$BUNDLE_ID" = "$(scripts/kernel_artifacts.sh id)"
          test "$(jq -er '.bundle_id' /tmp/kernel-correctness/correctness-evidence.json)" = "$BUNDLE_ID"
          test "$(jq -er '.source_commit' /tmp/kernel-correctness/correctness-evidence.json)" = "$GITHUB_SHA"
          test "$(jq -er '.artifact_sha256' /tmp/kernel-correctness/correctness-evidence.json)" = "$CANDIDATE_SHA"
          echo "sha256=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore tested generated kernel tree
        run: scripts/kernel_artifacts.sh fetch /tmp/kernel-bundle-candidate

      - name: Publish exact immutable qualified bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARLE_KERNEL_CORRECTNESS_STATUS: passed
          ARLE_KERNEL_CORRECTNESS_EVIDENCE: /tmp/kernel-correctness/correctness-evidence.json
          ARLE_KERNEL_TESTED_ARTIFACT_SHA256: ${{ steps.tested.outputs.sha256 }}
        run: scripts/kernel_artifacts.sh publish

      - name: Attest immutable bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            arle-kernels-t1-*.tar.gz
            arle-kernels-t1-*.tar.gz.sha256
