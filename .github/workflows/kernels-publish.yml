name: Kernels Publish

# Regenerate the TileLang AOT kernel bundle whenever a kernel-relevant source
# changes and publish it to the rolling `kernel-artifacts` release. Consumers
# (release/docker/CI) fetch the bundle instead of installing the tilelang
# Python stack — this job is the ONE place that needs it. build.rs hashes the
# kernel sources + ABI + requirements into each artifact's SRC_HASH, so a
# stale bundle is rejected per-kernel at consume time, never silently used.
on:
  push:
    branches: [main]
    paths:
      - crates/cuda-kernels/tools/tilelang/**
      - crates/cuda-kernels/kernels.toml
      - crates/cuda-kernels/build.rs
      - requirements-build.txt
  workflow_dispatch: {}

concurrency:
  group: kernels-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Regen T1 kernel bundle + publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install TileLang stack (pinned set + carried tvm-ffi patch)
        # Vanilla tvm-ffi at the pin aborts `import tilelang` under tilelang's
        # bundled TVM (tile-ai/tilelang#2367); rebuild it from sdist with the
        # carried patch — same flow as scripts/pod-tilelang-env.sh.
        run: |
          pip install --no-cache-dir -r requirements-build.txt
          pin="$(grep -oE 'apache-tvm-ffi==[0-9.]+' requirements-build.txt | cut -d= -f3)"
          pip download --no-deps --no-binary :all: -d /tmp/ffi "apache-tvm-ffi==$pin"
          tar -xzf /tmp/ffi/apache*tvm*ffi-*.tar.gz -C /tmp/ffi
          patch -p1 -d /tmp/ffi/apache*tvm*ffi-*/ \
            < crates/cuda-kernels/tools/tilelang/patches/tvm-ffi-legacy-tvm-compat.patch
          pip install --no-cache-dir "cython>=3.1.0" scikit-build-core setuptools-scm ninja cmake
          pip wheel --no-deps --no-build-isolation -w /tmp/ffi /tmp/ffi/apache*tvm*ffi-*/
          pip install --force-reinstall --no-deps /tmp/ffi/apache*tvm*ffi-*.whl
          python -c "import tilelang; print('tilelang OK', tilelang.__version__)"

      - name: Regenerate T1 kernel set (sm_80/86/89/90)
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_KERNEL_VENDOR: '1'
          ARLE_CUDA_KERNEL_CACHE: '0'
        run: cargo build --release --features cuda -p cuda-kernels

      - name: Publish bundle to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/kernel_artifacts.sh publish
