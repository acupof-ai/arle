name: Metal CI

# Sole macOS gate: checks + tests + release-shaped artifact packaging.
# (ci.yml used to run a second overlapping macos-14 job; deleted 2026-06-10.)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'scripts/package_macos_metal_artifact.sh'
      - 'benchmarks/snapshots/**'
      - '.github/workflows/metal-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'scripts/package_macos_metal_artifact.sh'
      - 'benchmarks/snapshots/**'
      - '.github/workflows/metal-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # .cargo/config.toml pins `rustc-wrapper = "sccache"`; install via
  # mozilla-actions/sccache-action so cargo doesn't fail on missing wrapper.
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: metal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal-check:
    name: Metal check + test (Apple Silicon)
    runs-on: macos-14   # ARM64 Apple Silicon runner

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Raw target/ caching on purpose (NOT Swatinem/rust-cache): rust-cache
      # prunes workspace-crate artifacts, which would drop mlx-sys' OUT_DIR
      # cmake build of MLX — the single most expensive thing this job makes.
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-ninja-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-metal-ninja-

      # Verify Metal C++ shim compiles and Rust type-checks cleanly.
      - name: cargo check (metal + no-cuda infer lib)
        run: cargo check -p infer-api --no-default-features --features metal,no-cuda --lib --release

      - name: cargo check (metal + no-cuda CLI)
        run: cargo check --no-default-features --features metal,no-cuda,cli -p arle --release --bin arle

      - name: cargo check (metal train/autograd libs)
        run: |
          cargo check -p autograd --release --features metal --lib
          cargo check -p train --release --features metal --lib

      - name: cargo test + clippy (kv-native-sys POSIX substrate)
        # POSIX-only persistence substrate (no Metal feature). macOS is the
        # canonical second POSIX target alongside Linux, so test + clippy here.
        run: |
          cargo test -p kv-native-sys --release
          cargo clippy -p kv-native-sys --release --all-targets -- -D warnings

      - name: cargo test (metal + no-cuda)
        run: >
          cargo test -p infer-api
          --no-default-features --features metal,no-cuda
          --lib --release
          -- --test-threads 1

      - name: cargo test (metal + no-cuda CLI crate unit tests)
        run: cargo test -p cli --release --no-default-features --features metal,no-cuda

      - name: cargo test (metal + no-cuda ARLE CLI tests)
        run: cargo test --no-default-features --features metal,no-cuda,cli -p arle --release

      # Serving is `arle serve` (cli/src/serve.rs); this build is the Metal
      # serve/bench surface and the release-shaped artifact.
      - name: cargo build ARLE CLI
        run: >
          cargo build
          --no-default-features --features metal,no-cuda,cli
          -p arle --bin arle --release

      # Validate that the baseline snapshots are well-formed JSON.
      # NOTE: Actually running benchmarks requires a model and a Metal GPU,
      # so the CI job only validates that the binary compiles and every
      # baseline snapshot parses correctly.
      - name: Validate baseline snapshots
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob('benchmarks/snapshots/*.json'))
          if not files:
              sys.exit('no benchmark snapshots found under benchmarks/snapshots/')
          for f in files:
              json.load(open(f))
              print(f'ok {f}')
          PY

      - name: Package macOS Metal artifact
        run: >
          ./scripts/package_macos_metal_artifact.sh
          arle-macos-arm64.tar.gz
          target/release/arle

      - name: Upload macOS Metal artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: arle-macos-arm64.tar.gz
          if-no-files-found: error
