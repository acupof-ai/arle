name: Metal CI

# Sole macOS gate: checks + tests + release-shaped artifact packaging.
# (ci.yml used to run a second overlapping macos-14 job; deleted 2026-06-10.)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'scripts/package_macos_metal_artifact.sh'
      - 'scripts/lever_gate.sh'
      - 'scripts/needle_gate.py'
      - 'scripts/needle_summary.py'
      - 'benchmarks/snapshots/**'
      - '.github/workflows/metal-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'scripts/package_macos_metal_artifact.sh'
      - 'scripts/lever_gate.sh'
      - 'scripts/needle_gate.py'
      - 'scripts/needle_summary.py'
      - 'benchmarks/snapshots/**'
      - '.github/workflows/metal-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # .cargo/config.toml pins `rustc-wrapper = "sccache"`; install via
  # mozilla-actions/sccache-action so cargo doesn't fail on missing wrapper.
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: metal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal-check:
    name: Metal check + test (Apple Silicon)
    runs-on: macos-14   # ARM64 Apple Silicon runner

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Raw target/ caching on purpose (NOT Swatinem/rust-cache): rust-cache
      # prunes workspace-crate artifacts, which would drop mlx-sys' OUT_DIR
      # cmake build of MLX — the single most expensive thing this job makes.
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-ninja-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-metal-ninja-

      # Test subsumes check: one merged Metal test run for the binary crates
      # (none have tests/ dirs, so --lib is a no-op) + one Metal typecheck for
      # the train/autograd libs (their tests/ hold CUDA cases skipped on macOS).
      # kv-native-sys is covered on Linux (ci.yml test-neutral lane).
      - name: cargo test (metal + no-cuda)
        run: >
          cargo test -p infer-api -p cli -p arle
          --no-default-features --features metal,no-cuda,cli
          --lib --release
          -- --test-threads 1

      - name: cargo check (metal train/autograd libs)
        run: |
          cargo check -p autograd --release --features metal --lib
          cargo check -p train --release --features metal --lib

      # Serving is `arle serve` (cli/src/serve.rs); this build is the Metal
      # serve/bench surface and the release-shaped artifact.
      - name: cargo build ARLE CLI
        run: >
          cargo build
          --no-default-features --features metal,no-cuda,cli
          -p arle --bin arle --release

      # Model-level correctness gate: needle ladder on the 0.8B test model.
      # The Metal executor downloads the HF repo on first serve boot.
      - name: Metal needle gate
        timeout-minutes: 10
        env:
          MODEL: mlx-community/Qwen3.5-0.8B-MLX-4bit
          GATE_PROFILE: metal
          LENGTHS: "115,300,446"
          RUNS: "1"
          PORT: "18189"
          LEVER_GATE_ALLOW_NO_BASELINE: "1"
          LEVER_GATE_SKIP_TEMP: "1"
          LEVER_GATE_SKIP_CONCURRENT: "1"
          RUST_LOG: info
          ARLE_METAL_AVAILABLE_RESERVE_MB: "1024"
        run: |
          bash scripts/lever_gate.sh "ci-metal" || {
            echo "=== serve_ci-metal.log ==="
            cat serve_ci-metal.log 2>/dev/null || echo "(no serve log)"
            exit 1
          }

      # Validate that the baseline snapshots are well-formed JSON.
      # Model-level correctness is covered by the needle gate above.
      - name: Validate baseline snapshots
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob('benchmarks/snapshots/*.json'))
          if not files:
              sys.exit('no benchmark snapshots found under benchmarks/snapshots/')
          for f in files:
              json.load(open(f))
              print(f'ok {f}')
          PY

      - name: Package macOS Metal artifact
        run: >
          ./scripts/package_macos_metal_artifact.sh
          arle-macos-arm64.tar.gz
          target/release/arle

      - name: Upload macOS Metal artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: arle-macos-arm64.tar.gz
          if-no-files-found: error
