name: CUDA CI

on:
  # Auto-trigger disabled: this workflow needs a self-hosted runner with the
  # `gpu`+`cuda` labels, and none is currently registered for the repo. Pushes
  # would queue forever and get cancel-in-progress'd by the next push. Re-enable
  # the `push` / `pull_request` blocks (see git history) once a runner is back.
  workflow_dispatch:
    inputs:
      kernel_candidate_run_id:
        description: Kernels Publish run containing kernel-bundle-candidate; blank runs checks only
        required: false
        type: string
      model_path:
        description: Model path for candidate qualification
        required: false
        type: string
      tested_capabilities:
        description: Exact capabilities exercised; blank derives them from the profile
        required: false
        type: string
      qualification_profile:
        description: Exact workload profile exercised by this run
        required: false
        default: qwen
        type: choice
        options:
          - qwen
          - qwen-fa3
          - dsv4

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CUDA_HOME: /usr/local/cuda

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-check:
    name: CUDA check + tiny fixture CLI
    if: ${{ inputs.kernel_candidate_run_id == '' }}
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cuda-${{ hashFiles('Cargo.lock', 'crates/cuda-kernels/kernels.toml') }}
          restore-keys: |
            ${{ runner.os }}-cuda-

      - name: cargo check (cuda + no-cuda infer lib)
        run: cargo check -p infer-api --release --no-default-features --features cuda,no-cuda --lib

      - name: cargo check (cuda + no-cuda CLI)
        run: >
          cargo check -p arle --release
          --no-default-features --features cuda,no-cuda,cli
          --bin arle

      - name: cargo test (cuda + no-cuda CLI crate)
        run: cargo test -p cli --release --no-default-features --features cuda,no-cuda

      - name: cargo test (cuda + no-cuda ARLE help/smoke path)
        run: >
          cargo test -p arle --release
          --no-default-features --features cuda,no-cuda,cli
          --test cli_smoke

  qualify-candidate:
    name: Qualify exact kernel candidate
    if: ${{ inputs.kernel_candidate_run_id != '' }}
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download named candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.kernel_candidate_run_id }}" -n kernel-bundle-candidate -D /tmp/kernel-candidate

      - name: Fetch candidate and build product cold
        env:
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_KERNEL_CACHE: '0'
          ARLE_CUDA_ENABLE_FA3: '1'
          INFER_TILELANG_PYTHON: /usr/bin/false
          CARGO_TARGET_DIR: product/cuda-kernels
        run: |
          test -n "${{ inputs.model_path }}"
          rm -rf "$CARGO_TARGET_DIR"
          scripts/kernel_artifacts.sh fetch /tmp/kernel-candidate
          cargo build --release --features cuda -p arle --bin arle

      - name: Validate hardware profile
        env:
          QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
          TESTED_CAPABILITIES_INPUT: ${{ inputs.tested_capabilities }}
        run: |
          if [[ "$QUALIFICATION_PROFILE" == dsv4 ]]; then
            mapfile -t sms < <(nvidia-smi --query-gpu=compute_cap --format=csv,noheader,nounits | sort -u)
          else
            mapfile -t sms < <(nvidia-smi --query-gpu=compute_cap --format=csv,noheader,nounits -i "${CUDA_VISIBLE_DEVICES:-0}" | sort -u)
          fi
          ((${#sms[@]} == 1))
          case "$QUALIFICATION_PROFILE:${sms[0]}" in
            qwen:8.0|qwen:8.6|qwen:8.9) derived_capabilities='' ;;
            qwen-fa3:9.0) derived_capabilities=fa3 ;;
            dsv4:9.0) derived_capabilities=flashmla,deepgemm-native ;;
            *) echo "profile/SM mismatch: $QUALIFICATION_PROFILE on ${sms[0]}" >&2; exit 1 ;;
          esac
          capabilities="${TESTED_CAPABILITIES_INPUT:-$derived_capabilities}"
          [[ "$capabilities" == "$derived_capabilities" ]] || {
            echo "tested capabilities mismatch: expected '$derived_capabilities', got '$capabilities'" >&2
            exit 1
          }
          printf '%s\n' "${sms[0]}" > tested-sm.txt
          printf '%s\n' "$capabilities" > tested-capabilities.txt

      - name: Run strict gate and capture product stats
        env:
          BIN: ${{ github.workspace }}/product/cuda-kernels/release/arle
          MODEL: ${{ inputs.model_path }}
          QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
          LENGTHS: '115,300,446,2000,8000'
          RUNS: '3'
          LEVER_GATE_REQUIRE_EXACT: '1'
          PORT: '18189'
        run: |
          case "$QUALIFICATION_PROFILE" in
            qwen|qwen-fa3) export GATE_PROFILE=generic ;;
            dsv4) export GATE_PROFILE=dsv4 ;;
          esac
          mapfile -t candidates < <(find /tmp/kernel-candidate -maxdepth 1 -name 'arle-kernels-t1-*.tar.gz' -type f)
          ((${#candidates[@]} == 1))
          producer="$(tar -tzf "${candidates[0]}" | grep 'arle-cuda-kernels.manifest$')"
          test "$(wc -l <<<"$producer")" -eq 1
          export STATS_OUT=stats.json
          product_sha="$(sha256sum "$BIN" | cut -d' ' -f1)"
          kernel_id="$(tar -xOzf "${candidates[0]}" "$producer" | sed -n 's/^kernel_build_id=//p')"
          export EXPECTED_PRODUCT_SHA256="$product_sha"
          export EXPECTED_KERNEL_BUNDLE_ID="$kernel_id"
          test -n "$EXPECTED_KERNEL_BUNDLE_ID"
          scripts/lever_gate.sh kernel-candidate
          ARLE_KERNEL_TEST_BINARY="$BIN" \
            ARLE_KERNEL_TESTED_SM="$(<tested-sm.txt)" \
            ARLE_KERNEL_QUALIFICATION_PROFILE="$QUALIFICATION_PROFILE" \
            ARLE_KERNEL_TESTED_CAPABILITIES="$(<tested-capabilities.txt)" \
            scripts/kernel_artifacts.sh qualify-fragment "${candidates[0]}" stats.json qualification-fragment.json

      - name: Upload qualification fragment
        uses: actions/upload-artifact@v7
        with:
          name: kernel-qualification-fragment
          path: |
            qualification-fragment.json
            tested-sm.txt
            tested-capabilities.txt
            stats.json
            needle_gate_kernel-candidate.log
