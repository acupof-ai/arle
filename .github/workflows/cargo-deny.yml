name: Cargo Deny

# Dependency-graph gates only fire when the dependency graph can change.
# The weekly cron catches newly-published advisories against an unchanged
# Cargo.lock — pushes alone would never re-check those.

on:
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories / Bans / Licenses
    runs-on: ubuntu-latest
    env:
      # sccache is not installed here; stay off even if a wrapper pin comes back.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Host-side, not the EmbarkStudios docker action: its musl container
      # can't satisfy rust-toolchain.toml (uninstalled 1.95.0-musl override
      # broke every run since 2026-06-30). Prebuilt binary via install-action
      # keeps the no-compile speed.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans licenses sources
