name: Cargo Deny

# Dependency-graph gates only fire when the dependency graph can change.
# The weekly cron catches newly-published advisories against an unchanged
# Cargo.lock — pushes alone would never re-check those.

on:
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories / Bans / Licenses
    runs-on: ubuntu-latest
    env:
      # config.toml pins rustc-wrapper=sccache for local dev; not installed here.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7

      # Host-side, not the EmbarkStudios docker action: its musl container
      # can't satisfy rust-toolchain.toml (uninstalled 1.95.0-musl override
      # broke every run since 2026-06-30). Prebuilt binary via install-action
      # keeps the no-compile speed.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2.86.3
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans licenses sources
