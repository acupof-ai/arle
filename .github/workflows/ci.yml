name: CI

on:
  push:
    branches: [ main, master ]
    # Skip CI for docs-only / memory / bench-output commits — they cannot
    # affect compile/test outcomes. Without this filter every wins/errors
    # entry triggers a 10-15 min CI run for no value.
    paths-ignore:
      - 'docs/**'
      - 'bench-output/**'
      - 'memory/**'
      - '**/*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'README.zh-CN.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'bench-output/**'
      - 'memory/**'
      - '**/*.md'
  # Manual cache-warming lane — see the concurrency note below.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # .cargo/config.toml pins `rustc-wrapper = "sccache"` for local dev; in CI
  # the empty override disables it. sccache's GHA backend flooded the 10 GB
  # Actions cache quota with per-object entries (10.7 GB / 2581 entries,
  # 2026-07-02), evicting the rust-cache snapshots below — every run built
  # cold (~50 min, was 5m39s warm) until the runner died OOM ("lost
  # communication"). One cache system per lane: Swatinem only on ubuntu.
  RUSTC_WRAPPER: ""

concurrency:
  # Dispatched runs get a unique group: a manual cache-warming run must survive
  # the push stream — under cancel-in-progress the ~40 min cold rebuild was
  # cancelled 6× in a row and the rust-cache never got saved (2026-07-02).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run repo hygiene checks
        run: python3 scripts/check_repo_hygiene.py

  shell-contracts:
    name: Shell Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run artifact, release, and pod contract tests
        run: |
          bash scripts/tests/test_cuda_prebuilt_export.sh
          bash scripts/tests/test_lever_gate.sh
          bash scripts/tests/test_kernel_artifact_qualification.sh
          bash scripts/tests/test_validate_release.sh
          bash scripts/tests/test_pod_flow.sh

  # macOS Metal coverage lives in metal-ci.yml (superset: checks + tests +
  # artifact packaging on macos-14). A second macOS job here was a duplicate.

  # ── Linux: lint (clippy subsumes cargo check) + CUDA-Rust typecheck ─────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (CPU-only surfaces)
        run: |
          cargo clippy -p infer-api --no-default-features --features cpu,no-cuda --lib -- -D warnings
          cargo clippy -p cli --no-default-features --features no-cuda -- -D warnings
          cargo clippy -p arle --no-default-features --features cpu,no-cuda,cli --bin arle -- -D warnings
          cargo clippy -p autograd --features no-cuda --lib -- -D warnings
          cargo clippy -p train --features no-cuda --lib -- -D warnings
          cargo clippy -p kv-native-sys --all-targets -- -D warnings

      # The ONLY automated gate for the CUDA-Rust surface: there is no GPU CI
      # (no self-hosted GPU runner; the full CUDA build is manual on the pod /
      # ssh V100), so without this step a CUDA type break lands on main silently
      # and only surfaces at build time.
      # `no-cuda` makes cuda-kernels' build.rs skip nvcc/TileLang compilation;
      # CUDARC_CUDA_VERSION pins cudarc's probe so no toolkit is needed.
      - name: cargo check (cuda + no-cuda typecheck, no GPU toolchain)
        env:
          CUDARC_CUDA_VERSION: "12080"
        run: |
          cargo check -p infer-api --release --no-default-features --features cuda,no-cuda --lib
          cargo check -p arle --release --no-default-features --features cuda,no-cuda,cli --bin arle
          cargo check -p cli --release --no-default-features --features cuda,no-cuda,nccl

  # Five parallel lanes; wall-clock = the slowest lane, not the sum.
  # `--profile release-fast` (cu=16, no LTO, incremental), NOT `--release`:
  # the release profile's codegen-units=1 + thin-LTO cold build OOM-killed
  # the 16 GB runner twice ("lost communication", ~50 min in) — test
  # binaries don't need runtime-perf codegen. Lint stays fast because
  # clippy runs the dev profile; same lever.
  test:
    name: Test (${{ matrix.lane.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: infer-api
            cmd: cargo test -p infer-api --profile release-fast --no-default-features --features cpu,no-cuda --lib
          - name: cli
            cmd: cargo test -p cli --profile release-fast --no-default-features --features no-cuda
          - name: arle
            cmd: cargo test -p arle --profile release-fast --no-default-features --features cpu,no-cuda,cli
          # Device-neutral crates above the backend seam. infer-core is the
          # scheduler/RadixCache — the most actively changed runtime code.
          - name: core
            cmd: >-
              cargo test --profile release-fast
              -p infer-core -p infer-server -p infer-plan -p infer-seam
              -p infer-moe -p infer-topo -p infer-util -p deepseek-spec -p agent
          - name: support
            cmd: cargo test -p chat -p tools -p qwen3-spec -p qwen35-spec -p kv-native-sys -p spec-train --profile release-fast
          # autograd: leaf crate, lightweight. Always completes, warms the
          # shared dep cache for the train lane below.
          - name: autograd
            cmd: cargo test -p autograd --profile release-fast --features no-cuda --lib
          # train: heaviest compile chain (train → agent → infer-api → infer-core).
          # Cold build OOMs the 16 GB runner at default parallelism ("lost
          # communication" at ~48 min). Cap parallelism to stay under memory;
          # once warm cache lands the lane runs in budget.
          - name: train
            cmd: >-
              CARGO_BUILD_JOBS=2 CARGO_PROFILE_RELEASE_FAST_CODEGEN_UNITS=4
              cargo test -p train --profile release-fast --features no-cuda --lib
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # `v2` prefix abandons the poisoned `test-support` cache (an OOM-killed
          # job never runs the save step, so `cache-on-failure` couldn't rescue it).
          key: test-v2-${{ matrix.lane.name }}
          # A failed/cancelled lane still saves its build cache — otherwise one
          # broken test strands every later run cold (support lane, 2026-07-02).
          cache-on-failure: true

      - name: cargo test (${{ matrix.lane.name }})
        run: ${{ matrix.lane.cmd }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scoped fmt check diffs against the pre-push SHA; depth 1 has
          # no parent commit and used to make the check a silent no-op.
          fetch-depth: 2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt check (scoped to changed .rs files)
        # Workspace-wide `cargo fmt --all -- --check` trips on unformatted
        # files committed by parallel tracks that this push didn't touch.
        # Scope to the actual delta so CI failure tracks the push, not the
        # tree. Drift is caught by the nightly full-workspace sweep
        # (fmt-nightly.yml). The script falls back to the full check rather
        # than skipping when no diff base can be resolved.
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-fmt-check-changed.sh

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: |
          python -m pytest tests/python/ -v
          python -m pytest scripts/tests/test_convert_gptq_to_w4a16.py -v
