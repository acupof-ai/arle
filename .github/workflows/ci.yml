name: CI

on:
  push:
    branches: [ main, master ]
    # Skip CI for docs-only / memory / bench-output commits — they cannot
    # affect compile/test outcomes. Without this filter every wins/errors
    # entry triggers a 10-15 min CI run for no value.
    paths-ignore:
      - 'docs/**'
      - 'bench-output/**'
      - 'memory/**'
      - '**/*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'README.zh-CN.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'bench-output/**'
      - 'memory/**'
      - '**/*.md'
  # Manual cache-warming lane — see the concurrency note below.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # .cargo/config.toml pins `rustc-wrapper = "sccache"` for local dev; in CI
  # the empty override disables it. sccache's GHA backend flooded the 10 GB
  # Actions cache quota with per-object entries (10.7 GB / 2581 entries,
  # 2026-07-02), evicting the rust-cache snapshots below — every run built
  # cold (~50 min, was 5m39s warm) until the runner died OOM ("lost
  # communication"). One cache system per lane: Swatinem only on ubuntu.
  RUSTC_WRAPPER: ""

concurrency:
  # Dispatched runs get a unique group: a manual cache-warming run must survive
  # the push stream — under cancel-in-progress the ~40 min cold rebuild was
  # cancelled 6× in a row and the rust-cache never got saved (2026-07-02).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run repo hygiene checks
        run: python3 scripts/check_repo_hygiene.py

  shell-contracts:
    name: Shell Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run artifact, release, and pod contract tests
        run: |
          bash scripts/tests/test_cuda_prebuilt_export.sh
          bash scripts/tests/test_lever_gate.sh
          bash scripts/tests/test_kernel_artifact_qualification.sh
          bash scripts/tests/test_validate_release.sh
          bash scripts/tests/test_pod_flow.sh

  # macOS Metal coverage lives in metal-ci.yml (superset: checks + tests +
  # artifact packaging on macos-14). A second macOS job here was a duplicate.

  # ── Linux: lint (clippy subsumes cargo check) + CUDA-Rust typecheck ─────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo clippy (CPU-only surfaces)
        run: |
          cargo clippy -p infer-api --no-default-features --features cpu,no-cuda --lib -- -D warnings
          cargo clippy -p cli --no-default-features --features no-cuda -- -D warnings
          cargo clippy -p arle --no-default-features --features cpu,no-cuda,cli --bin arle -- -D warnings
          cargo clippy -p autograd --features no-cuda --lib -- -D warnings
          cargo clippy -p train --features no-cuda --lib -- -D warnings
          cargo clippy -p kv-native-sys --all-targets -- -D warnings

      # The ONLY automated gate for the CUDA-Rust surface: there is no GPU CI
      # (no self-hosted GPU runner; the full CUDA build is manual on the pod /
      # ssh V100), so without this step a CUDA type break lands on main silently
      # and only surfaces at build time.
      # `no-cuda` makes cuda-kernels' build.rs skip nvcc/TileLang compilation;
      # CUDARC_CUDA_VERSION pins cudarc's probe so no toolkit is needed.
      # clippy, not check: `cargo check` lets clippy errors accumulate in
      # cuda-gated code; `nccl,deepep` lint the multi-rank and DeepEP surfaces.
      - name: cargo clippy (cuda + no-cuda typecheck, no GPU toolchain)
        env:
          CUDARC_CUDA_VERSION: "12080"
        run: |
          cargo clippy -p infer-api --release --no-default-features --features cuda,no-cuda,nccl,deepep --lib -- -D warnings
          cargo clippy -p arle --release --no-default-features --features cuda,no-cuda,cli,nccl,deepep --bin arle -- -D warnings
          cargo clippy -p cli --release --no-default-features --features cuda,no-cuda,nccl,deepep -- -D warnings

      # Enforced 2026-08-23: tree clean (zero advisories; paste 1.0.15 is an
      # unmaintained warning, which does not fail the lane).
      - name: Install cargo-audit
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # Two lanes by feature set (cargo rebuilds on feature change, so crates
  # sharing a set share one build). `--lib` on the backend lane is a no-op for
  # infer-api/cli/arle (no tests/ dir) and load-bearing for autograd/train
  # (their tests/ hold ungated CUDA cases). `--profile release-fast` (cu=16,
  # no LTO, incremental), NOT `--release`: the release profile's cu=1 +
  # thin-LTO cold build OOM-killed the 16 GB runner twice — test binaries
  # don't need runtime-perf codegen.
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # train is the heaviest chain (train → agent → infer-api → infer-core);
    # its cold build OOMs the 16 GB runner at default parallelism. Cap jobs
    # for the whole lane — train dominates wall-clock anyway.
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_FAST_CODEGEN_UNITS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-backend
          # A failed/cancelled lane still saves its build cache — otherwise
          # one broken test strands every later run cold.
          cache-on-failure: true

      # No --lib: it skipped tests/ entirely, and crates/train/tests stayed
      # broken through a dead-code deletion nobody's lane compiled.
      - name: cargo test (backend)
        run: >-
          cargo test -p infer-api -p arle -p cli -p autograd -p train
          --profile release-fast --no-default-features
          --features cpu,no-cuda,cli

  test-neutral:
    name: Test (device-neutral)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-neutral
          cache-on-failure: true

      - name: cargo test (device-neutral)
        run: >-
          cargo test --profile release-fast
          -p infer-core -p infer-server -p infer-plan -p infer-seam
          -p infer-moe -p infer-topo -p infer-util -p deepseek-spec -p agent
          -p chat -p tools -p qwen3-spec -p qwen35-spec -p kv-native-sys
          -p spec-train

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scoped fmt check diffs against the pre-push SHA; depth 1 has
          # no parent commit and used to make the check a silent no-op.
          fetch-depth: 2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: cargo fmt check (scoped to changed .rs files)
        # Workspace-wide `cargo fmt --all -- --check` trips on unformatted
        # files committed by parallel tracks that this push didn't touch.
        # Scope to the actual delta so CI failure tracks the push, not the
        # tree. Drift is caught by the nightly full-workspace sweep
        # (fmt-nightly.yml). The script falls back to the full check rather
        # than skipping when no diff base can be resolved.
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-fmt-check-changed.sh

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # requirements-build.txt is otherwise only installed by kernels-publish.yml,
      # which is push-to-main only — an unsatisfiable pin lands red after merge
      # (#245, and 82f89b497 before it). Metadata-only resolve, no wheel download.
      - name: Resolve requirements-build.txt (metadata only)
        run: |
          pip install -q uv==0.9.24
          uv pip compile --index-strategy unsafe-best-match \
            --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
            -o "$RUNNER_TEMP/build-req.lock" requirements-build.txt

      - name: Run pytest
        run: |
          python -m pytest tests/python/ -v
          python -m pytest scripts/tests/test_convert_gptq_to_w4a16.py -v
