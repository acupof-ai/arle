name: Docker Dev Image

on:
  workflow_dispatch:
  push:
    tags:
      - "dev-*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arle

jobs:
  docker-dev:
    name: Build dev image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          sha="${GITHUB_SHA::8}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_NAME}:dev-${sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and optionally push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: dev
          platforms: linux/amd64
          load: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.tags.outputs.image }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:dev-cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:dev-cache,mode=max

      - name: Sanity check local image
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          docker run --rm "${{ steps.tags.outputs.image }}" bash -lc \
            'cargo --version && nvcc --version'

      - name: Sanity check pushed image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm "${{ steps.tags.outputs.image }}" bash -lc \
            'cargo --version && nvcc --version'
