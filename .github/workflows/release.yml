name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` pins `rustc-wrapper = "sccache"`, but the release lanes
  # don't install sccache (unlike ci.yml/metal-ci.yml). Disable the wrapper here
  # so cargo doesn't fail on the missing binary — release builds are one-shot
  # cold, sccache buys nothing. Empty value = no wrapper (overrides config.toml).
  RUSTC_WRAPPER: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-release:
    name: Validate release identity and evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag, blockers, product, and kernel evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/validate_release.sh "${{ github.ref_name }}"

  # ── macOS arm64: Metal/MLX backend ──────────────────────────────────────────
  build-macos:
    name: Build macOS arm64 (Metal)
    needs: qualify-release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same key prefix as metal-ci.yml so tag builds restore the warm cache
      # written by main-branch Metal CI runs (tag refs can read default-branch
      # caches; the old macos-arm64-cargo prefix had no writer left).
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-ninja-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-metal-ninja-

      # `metal_serve` was an `infer`-crate bin removed in the rewrite; serving is
      # now `arle serve`. The ARLE CLI build below is the Metal release artifact.
      - name: Build ARLE CLI (Metal, no-cuda)
        run: >
          cargo build --release
          --no-default-features --features metal,no-cuda,cli
          -p arle --bin arle

      - name: Package macOS artifacts
        run: >
          ./scripts/package_macos_metal_artifact.sh
          arle-${{ github.ref_name }}-macos-arm64.tar.gz
          target/release/arle

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: arle-${{ github.ref_name }}-macos-arm64.tar.gz

  # ── Linux x86_64: CUDA backend ───────────────────────────────────────────────
  build-linux:
    name: Build Linux x86_64 (CUDA)
    needs: qualify-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Fetch exact prebuilt TileLang kernel bundle (zero-Python lane)
        # Exact bundle id for this checkout. Prefer a formal qualification
        # sidecar when present; otherwise consume the immutable candidate pack
        # (H20/pod is the operator correctness bar while multi-SM self-hosted
        # runners are unregistered). Never `latest`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if scripts/kernel_artifacts.sh fetch-qualified; then
            echo "using qualified kernel bundle"
          else
            echo "no qualification sidecar; fetching exact candidate pack"
            scripts/kernel_artifacts.sh fetch
          fi

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-cargo-${{ hashFiles('**/Cargo.lock', 'crates/cuda-kernels/kernels.toml') }}
          restore-keys: linux-x86-cargo-

      # `infer`/`bench_serving` were standalone bins removed in the rewrite; the
      # CUDA release artifact is the `arle` binary (serving via `arle serve`).
      - name: Build ARLE CLI (CUDA)
        env:
          # No GPU on CI runners — pin SM targets to avoid nvidia-smi probing.
          # T1 set: sm_80 (A100) + sm_86 (A10/3090) + sm_89 (L4/4090) + sm_90 (H100).
          # See docs/environment.md for tier policy.
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          # FlashMLA stays ENABLED here: build.rs compiles its sm90 sparse_fp8
          # TUs sm_90a-ONLY (cluster launch_bounds need the arch variant),
          # decoupled from TORCH_CUDA_ARCH_LIST above, so the T1 binary carries
          # FlashMLA-sm_90a for H20/H100 while every other kernel covers sm_80..90.
          # Dispatched only on sm_90 by the runtime gate (dsv4_flashmla_decode).
        run: cargo build --release --features cuda -p arle --bin arle

      - name: Package Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: arle-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      # No `name` → downloads every uploaded artifact; merge-multiple flattens
      # them into the workspace.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Check out repo (for install.sh)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Stage install.sh
        run: cp src/scripts/install.sh install.sh

      - name: Generate release checksums
        run: sha256sum arle-${{ github.ref_name }}-*.tar.gz > SHA256SUMS.txt

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: arle-${{ github.ref_name }}-*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            arle-${{ github.ref_name }}-*.tar.gz
            SHA256SUMS.txt
            install.sh

  # ── Homebrew tap bump ─────────────────────────────────────────────────────────
  # Requires repository secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token)
  # with `Contents: Read and write` scope on cklxx/homebrew-tap.
  bump-homebrew:
    name: Bump Homebrew formula
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') && needs.create-release.result == 'success' }}  # skip pre-releases; run only when create-release succeeded
    steps:
      - name: Update Formula/arle.rb in cklxx/homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: arle
          formula-path: Formula/arle.rb
          homebrew-tap: cklxx/homebrew-tap
          base-branch: main
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/cklxx/arle/releases/download/${{ github.ref_name }}/arle-${{ github.ref_name }}-macos-arm64.tar.gz
          commit-message: |
            arle ${{ github.ref_name }}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
