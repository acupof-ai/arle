name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` pins `rustc-wrapper = "sccache"`, but the release lanes
  # don't install sccache (unlike ci.yml/metal-ci.yml). Disable the wrapper here
  # so cargo doesn't fail on the missing binary — release builds are one-shot
  # cold, sccache buys nothing. Empty value = no wrapper (overrides config.toml).
  RUSTC_WRAPPER: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-release:
    name: Validate release identity and evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag, blockers, product, and kernel evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/validate_release.sh "${{ github.ref_name }}"

  # ── macOS arm64: Metal/MLX backend ──────────────────────────────────────────
  build-macos:
    name: Build macOS arm64 (Metal)
    needs: qualify-release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same key prefix as metal-ci.yml so tag builds restore the warm cache
      # written by main-branch Metal CI runs (tag refs can read default-branch
      # caches; the old macos-arm64-cargo prefix had no writer left).
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-ninja-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-metal-ninja-

      # `metal_serve` was an `infer`-crate bin removed in the rewrite; serving is
      # now `arle serve`. The ARLE CLI build below is the Metal release artifact.
      - name: Build ARLE CLI (Metal, no-cuda)
        run: >
          cargo build --release
          --no-default-features --features metal,no-cuda,cli
          -p arle --bin arle

      - name: Package macOS artifacts
        run: >
          ./scripts/package_macos_metal_artifact.sh
          arle-${{ github.ref_name }}-macos-arm64.tar.gz
          target/release/arle

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: arle-${{ github.ref_name }}-macos-arm64.tar.gz

  # ── Linux x86_64: CUDA backend ───────────────────────────────────────────────
  build-linux:
    name: Build Linux x86_64 (CUDA)
    needs: qualify-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Fetch exact prebuilt TileLang kernel bundle (zero-Python lane)
        # Exact bundle id for this checkout. Prefer a formal qualification
        # sidecar when present; otherwise consume the immutable candidate pack
        # (H20/pod is the operator correctness bar while multi-SM self-hosted
        # runners are unregistered). Never `latest`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if scripts/kernel_artifacts.sh fetch-qualified; then
            echo "using qualified kernel bundle"
          else
            echo "no qualification sidecar; fetching exact candidate pack"
            scripts/kernel_artifacts.sh fetch
          fi

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-cargo-${{ hashFiles('**/Cargo.lock', 'crates/cuda-kernels/kernels.toml') }}
          restore-keys: linux-x86-cargo-

      # `infer`/`bench_serving` were standalone bins removed in the rewrite; the
      # CUDA release artifact is the `arle` binary (serving via `arle serve`).
      - name: Build ARLE CLI (CUDA)
        env:
          # No GPU on CI runners — pin SM targets to avoid nvidia-smi probing.
          # T1 set: sm_80 (A100) + sm_86 (A10/3090) + sm_89 (L4/4090) + sm_90 (H100).
          # See docs/environment.md for tier policy.
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          ARLE_CUDA_ENABLE_FA3: '1'
          # FlashMLA stays ENABLED here: build.rs compiles its sm90 sparse_fp8
          # TUs sm_90a-ONLY (cluster launch_bounds need the arch variant),
          # decoupled from TORCH_CUDA_ARCH_LIST above, so the T1 binary carries
          # FlashMLA-sm_90a for H20/H100 while every other kernel covers sm_80..90.
          # Dispatched only on sm_90 by the runtime gate (dsv4_flashmla_decode).
        run: cargo build --release --features cuda -p arle --bin arle

      - name: Package Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: arle-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ── Linux x86_64: CUDA sm_70 (Volta / V100 legacy lane) ──────────────────────
  # SM-pinned legacy build per docs/environment.md §T0-legacy: TORCH_CUDA_ARCH_LIST=7.0
  # ONLY (the policy rejects `7.0;8.9` mixing so the T1 binary never carries Volta
  # fallback). HARDWARE-UNVERIFIED in CI: no V100 on the runner, and build.rs
  # hard-fails (not warn-skip) if any required operator cannot emit an sm_70 cubin
  # — so this job is continue-on-error. It attaches the binary only if it compiles;
  # a failure is non-blocking and signals fix-forward, never nuking the release.
  build-linux-v100:
    name: Build Linux x86_64 (CUDA sm_70 / V100, best-effort)
    needs: qualify-release
    runs-on: ubuntu-22.04
    continue-on-error: true
    # Off by default: a no-GPU cross-compile runner can't validate sm_70. sm_70 is
    # verified on the real V100 box instead (ssh v100; see
    # wins/2026-07-13-sm70-gated-delta-rule-fp16-gate).
    # Set repo var ENABLE_EXOTIC_SM_LANES=true to run it.
    if: ${{ vars.ENABLE_EXOTIC_SM_LANES == 'true' }}

    steps:
      - uses: actions/checkout@v7

      # The default ubuntu-22.04 runner has ~14 GB free on /, and this job's
      # chain is unusually disk-heavy: CUDA toolkit 12.8 (~4 GB) + torch cu129
      # (~6 GB extracted) + a from-source TileLang/TVM build (clone + compile,
      # ~8-10 GB). v0.2.1-rc1 OOD'd ("No space left on device") at the torch
      # download. Reclaim the preinstalled SDKs ARLE never uses (Android, GHC,
      # .NET, CodeQL, boost) to free ~25-30 GB BEFORE the CUDA/torch installs.
      # T1 + Blackwell don't need this (no from-source build) so they're left
      # untouched.
      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/dotnet /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean || true
          echo "after:"; df -h / | tail -1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install Python build dependencies (required for AOT kernel compilation)
        run: pip install --no-cache-dir -r requirements-build.txt

      # Volta (sm_70) has no bf16 tensor cores. The attention AOT kernels feed their
      # GEMM operands as fp16 in-kernel (gemm_dtype gate in
      # batch_{prefill,decode}_paged_hd*.py) so dispatch hits TileLang's stock
      # GemmMMASm70 mma.sync tensor-core path — validated on real V100 (cosine
      # 0.999999) with STOCK TileLang. No source patch is needed: the former
      # scripts/sm70_tilelang.patch cuda.fma fallback (PR tile-ai/tilelang#2339) is
      # dead for these kernels and was removed 2026-06-15 (confirmed by a no-patch
      # build on real V100). Build from source (not the pinned wheel) for THIS
      # SM-pinned job only: the non-editable install reproduces the official wheel's
      # data layout (src/tl_templates + 3rdparty/cutlass/include) that build.rs's
      # probe (tilelang_include_dirs) requires, and --no-build-isolation lets the C++
      # build see the already-pinned torch / apache-tvm-ffi cu12 stack. CUDA 12.8
      # (installed above) satisfies stock tilelang's c++20 codegen. T1 + Blackwell keep
      # the pinned wheel: separate runners, separate Python envs, zero blast radius.
      # tilelang >=0.1.13 imports cleanly against vanilla apache-tvm-ffi (the
      # first-wins TypeAttr fix from tile-ai/tilelang#2367 landed upstream), so no
      # ARLE tvm-ffi patch is needed.
      - name: Build TileLang from source (sm_70 layout templates)
        run: |
          pip install --no-cache-dir "cython>=3.1.0" scikit-build-core "z3-solver>=4.13.0,<4.15.5" ninja cmake
          git clone --recursive --shallow-submodules --depth 1 --branch v0.1.13 \
            https://github.com/tile-ai/tilelang.git /tmp/tilelang-sm70
          pip install --no-cache-dir --no-build-isolation /tmp/tilelang-sm70

      - name: Verify TileLang import (no tvm-ffi patch needed)
        run: scripts/ci-patch-tvm-ffi.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-sm70-cargo-${{ hashFiles('**/Cargo.lock', 'crates/cuda-kernels/kernels.toml') }}
          restore-keys: linux-x86-sm70-cargo-

      - name: Build ARLE CLI (CUDA sm_70 pinned)
        env:
          # Volta V100 only — SM-pinned, no T1 SMs (sm-coverage.md §"Why sm_70 is separate").
          TORCH_CUDA_ARCH_LIST: '7.0'
          ARLE_CUDA_ENABLE_FA3: '0'
          # FlashMLA is a Hopper-only (sm_90a) kernel — dormant on Volta, so keep
          # it out of the sm_70 binary to stay lean (the runtime gate never fires
          # here). build.rs swaps in a clean stub; no FlashMLA half-state.
          ARLE_CUDA_DISABLE_FLASHMLA: '1'
        run: cargo build --release --features cuda -p arle --bin arle

      - name: Package Linux sm_70 artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64-sm70.tar.gz -C dist .

      - name: Upload Linux sm_70 artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-sm70
          path: arle-${{ github.ref_name }}-linux-x86_64-sm70.tar.gz
          if-no-files-found: warn

  # ── Linux x86_64: CUDA Blackwell T2 (sm_100 + sm_120, opt-in) ────────────────
  # T2 opt-in per docs/environment.md: sm_100 (B100/B200) + sm_120 (RTX 5090).
  # HARDWARE-UNVERIFIED: no Blackwell hardware exists in CI, and TileLang 0.1.11
  # sm_120 codegen is not yet confirmed (sm-coverage.md "Why T2 is opt-in"). Same
  # contract as the V100 job: continue-on-error, attaches only if it compiles.
  build-linux-blackwell:
    name: Build Linux x86_64 (CUDA Blackwell sm_100+sm_120, best-effort)
    needs: qualify-release
    runs-on: ubuntu-22.04
    continue-on-error: true
    # Off by default: no Blackwell hardware exists in CI to validate sm_100/sm_120
    # codegen. Set repo var ENABLE_EXOTIC_SM_LANES=true to run it once Blackwell
    # hardware is available.
    if: ${{ vars.ENABLE_EXOTIC_SM_LANES == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install Python build dependencies (required for AOT kernel compilation)
        run: pip install --no-cache-dir -r requirements-build.txt

      - name: Verify TileLang import (no tvm-ffi patch needed)
        run: scripts/ci-patch-tvm-ffi.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-blackwell-cargo-${{ hashFiles('**/Cargo.lock', 'crates/cuda-kernels/kernels.toml') }}
          restore-keys: linux-x86-blackwell-cargo-

      - name: Build ARLE CLI (CUDA Blackwell)
        env:
          # B100/B200 (sm_100) + RTX 5090 (sm_120). Datacenter + consumer Blackwell.
          TORCH_CUDA_ARCH_LIST: '10.0;12.0'
          ARLE_CUDA_ENABLE_FA3: '0'
          # FlashMLA is a Hopper-only (sm_90a) kernel — dormant on Blackwell, so
          # keep it out of the sm_100/sm_120 binary to stay lean (the runtime gate
          # never fires here). build.rs swaps in a clean stub; no FlashMLA half-state.
          ARLE_CUDA_DISABLE_FLASHMLA: '1'
        run: cargo build --release --features cuda -p arle --bin arle

      - name: Package Linux Blackwell artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64-blackwell.tar.gz -C dist .

      - name: Upload Linux Blackwell artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-blackwell
          path: arle-${{ github.ref_name }}-linux-x86_64-blackwell.tar.gz
          if-no-files-found: warn

  # ── GitHub Release ────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-linux-v100, build-linux-blackwell]
    # Gate on the two VERIFIED builds only (Metal + T1 CUDA). The sm_70 and
    # Blackwell jobs are best-effort: !cancelled() lets this job run even when
    # they fail, and their artifacts attach via glob only if they were uploaded.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      # No `name` → downloads every uploaded artifact; merge-multiple flattens
      # them into the workspace. Missing optional artifacts (failed sm_70 /
      # Blackwell builds) are simply absent — the glob steps below skip them.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Check out repo (for install.sh)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Stage install.sh
        run: cp src/scripts/install.sh install.sh

      - name: Generate release checksums
        run: sha256sum arle-${{ github.ref_name }}-*.tar.gz > SHA256SUMS.txt

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: arle-${{ github.ref_name }}-*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            arle-${{ github.ref_name }}-*.tar.gz
            SHA256SUMS.txt
            install.sh

  # ── Homebrew tap bump ─────────────────────────────────────────────────────────
  # Requires repository secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token)
  # with `Contents: Read and write` scope on cklxx/homebrew-tap.
  bump-homebrew:
    name: Bump Homebrew formula
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}  # skip pre-releases (e.g. v0.1.0-rc1)
    steps:
      - name: Update Formula/arle.rb in cklxx/homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: arle
          formula-path: Formula/arle.rb
          homebrew-tap: cklxx/homebrew-tap
          base-branch: main
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/cklxx/arle/releases/download/${{ github.ref_name }}/arle-${{ github.ref_name }}-macos-arm64.tar.gz
          commit-message: |
            arle ${{ github.ref_name }}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
