name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── macOS arm64: Metal/MLX backend ──────────────────────────────────────────
  build-macos:
    name: Build macOS arm64 (Metal)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same key prefix as metal-ci.yml so tag builds restore the warm cache
      # written by main-branch Metal CI runs (tag refs can read default-branch
      # caches; the old macos-arm64-cargo prefix had no writer left).
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-metal-

      # `metal_serve` was an `infer`-crate bin removed in the rewrite; serving is
      # now `arle serve`. The ARLE CLI build below is the Metal release artifact.
      - name: Build ARLE CLI (Metal, no-cuda)
        run: >
          cargo build --release
          --no-default-features --features metal,no-cuda,cli
          -p agent-infer --bin arle

      - name: Package macOS artifacts
        run: >
          ./scripts/package_macos_metal_artifact.sh
          arle-${{ github.ref_name }}-macos-arm64.tar.gz
          target/release/arle

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: arle-${{ github.ref_name }}-macos-arm64.tar.gz

  # ── Linux x86_64: CUDA backend ───────────────────────────────────────────────
  build-linux:
    name: Build Linux x86_64 (CUDA)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install Python build dependencies (required for AOT kernel compilation)
        # Keep release CUDA builds aligned with the repo build image and
        # cuda-kernels build script requirements.
        run: pip install --no-cache-dir -r requirements-build.txt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86-cargo-

      # `infer`/`bench_serving` were standalone bins removed in the rewrite; the
      # CUDA release artifact is the `arle` binary (serving via `arle serve`).
      - name: Build ARLE CLI (CUDA)
        env:
          # No GPU on CI runners — pin SM targets to avoid nvidia-smi probing.
          # T1 set: sm_80 (A100) + sm_86 (A10/3090) + sm_89 (L4/4090) + sm_90 (H100).
          # See docs/plans/sm-coverage.md for tier policy.
          TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0'
          # FlashMLA sm90 sparse_fp8 needs sm_90a (cluster launch_bounds); plain
          # 9.0 hard-fails (build.rs:1783). FlashMLA is a pod-only sm_90a artifact
          # (sm-coverage.md), so disable it — build.rs swaps in a clean stub.
          ARLE_CUDA_DISABLE_FLASHMLA: '1'
        run: cargo build --release --features cuda -p agent-infer --bin arle

      - name: Package Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: arle-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ── Linux x86_64: CUDA sm_70 (Volta / V100 legacy lane) ──────────────────────
  # SM-pinned legacy build per docs/plans/sm-coverage.md §T0-legacy: TORCH_CUDA_ARCH_LIST=7.0
  # ONLY (the policy rejects `7.0;8.9` mixing so the T1 binary never carries Volta
  # fallback). HARDWARE-UNVERIFIED in CI: no V100 on the runner, and build.rs
  # hard-fails (not warn-skip) if any required operator cannot emit an sm_70 cubin
  # — so this job is continue-on-error. It attaches the binary only if it compiles;
  # a failure is non-blocking and signals fix-forward, never nuking the release.
  build-linux-v100:
    name: Build Linux x86_64 (CUDA sm_70 / V100, best-effort)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install Python build dependencies (required for AOT kernel compilation)
        run: pip install --no-cache-dir -r requirements-build.txt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-sm70-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86-sm70-cargo-

      - name: Build ARLE CLI (CUDA sm_70 pinned)
        env:
          # Volta V100 only — SM-pinned, no T1 SMs (sm-coverage.md §"Why sm_70 is separate").
          TORCH_CUDA_ARCH_LIST: '7.0'
          # FlashMLA is sm_90a-only — cannot target Volta. Disable (pod-only artifact).
          ARLE_CUDA_DISABLE_FLASHMLA: '1'
        run: cargo build --release --features cuda -p agent-infer --bin arle

      - name: Package Linux sm_70 artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64-sm70.tar.gz -C dist .

      - name: Upload Linux sm_70 artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-sm70
          path: arle-${{ github.ref_name }}-linux-x86_64-sm70.tar.gz
          if-no-files-found: warn

  # ── Linux x86_64: CUDA Blackwell T2 (sm_100 + sm_120, opt-in) ────────────────
  # T2 opt-in per docs/plans/sm-coverage.md: sm_100 (B100/B200) + sm_120 (RTX 5090).
  # HARDWARE-UNVERIFIED: no Blackwell hardware exists in CI, and TileLang 0.1.11
  # sm_120 codegen is not yet confirmed (sm-coverage.md "Why T2 is opt-in"). Same
  # contract as the V100 job: continue-on-error, attaches only if it compiles.
  build-linux-blackwell:
    name: Build Linux x86_64 (CUDA Blackwell sm_100+sm_120, best-effort)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: network

      - name: Install Python build dependencies (required for AOT kernel compilation)
        run: pip install --no-cache-dir -r requirements-build.txt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86-blackwell-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86-blackwell-cargo-

      - name: Build ARLE CLI (CUDA Blackwell)
        env:
          # B100/B200 (sm_100) + RTX 5090 (sm_120). Datacenter + consumer Blackwell.
          TORCH_CUDA_ARCH_LIST: '10.0;12.0'
          # FlashMLA is sm_90a-only — cannot target Blackwell. Disable (pod-only artifact).
          ARLE_CUDA_DISABLE_FLASHMLA: '1'
        run: cargo build --release --features cuda -p agent-infer --bin arle

      - name: Package Linux Blackwell artifacts
        run: |
          mkdir -p dist
          cp target/release/arle dist/
          tar -czf arle-${{ github.ref_name }}-linux-x86_64-blackwell.tar.gz -C dist .

      - name: Upload Linux Blackwell artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-blackwell
          path: arle-${{ github.ref_name }}-linux-x86_64-blackwell.tar.gz
          if-no-files-found: warn

  # ── GitHub Release ────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-linux-v100, build-linux-blackwell]
    # Gate on the two VERIFIED builds only (Metal + T1 CUDA). The sm_70 and
    # Blackwell jobs are best-effort: !cancelled() lets this job run even when
    # they fail, and their artifacts attach via glob only if they were uploaded.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      # No `name` → downloads every uploaded artifact; merge-multiple flattens
      # them into the workspace. Missing optional artifacts (failed sm_70 /
      # Blackwell builds) are simply absent — the glob steps below skip them.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Check out repo (for install.sh)
        uses: actions/checkout@v6
        with:
          path: src

      - name: Stage install.sh
        run: cp src/scripts/install.sh install.sh

      - name: Generate release checksums
        run: sha256sum arle-${{ github.ref_name }}-*.tar.gz > SHA256SUMS.txt

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: arle-${{ github.ref_name }}-*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            arle-${{ github.ref_name }}-*.tar.gz
            SHA256SUMS.txt
            install.sh

  # ── Homebrew tap bump ─────────────────────────────────────────────────────────
  # Requires repository secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token)
  # with `Contents: Read and write` scope on cklxx/homebrew-tap.
  bump-homebrew:
    name: Bump Homebrew formula
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}  # skip pre-releases (e.g. v0.1.0-rc1)
    steps:
      - name: Update Formula/arle.rb in cklxx/homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: arle
          formula-path: Formula/arle.rb
          homebrew-tap: cklxx/homebrew-tap
          base-branch: main
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/cklxx/arle/releases/download/${{ github.ref_name }}/arle-${{ github.ref_name }}-macos-arm64.tar.gz
          commit-message: |
            arle ${{ github.ref_name }}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
